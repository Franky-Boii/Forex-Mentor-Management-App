<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex CEO — Mentorship & Trading Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="app">
    <aside class="sidebar">
        <div class="brand" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <div>
                <div class="logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 6-8 3 4" stroke="#5B8DEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    Forex CEO
                </div>
                <div class="tag">Mentorship & Journal</div>
            </div>
            <button id="themeToggle" class="btn btn-ghost btn-icon" style="padding: 6px 10px; font-size: 13px;" title="Toggle Appearance Mode">☀️</button>
        </div>
        <nav class="nav" id="nav">
            <button class="active" data-tab="dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg><span class="lbl">Dashboard</span></button>
            <button data-tab="students"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.6"/><circle cx="17.5" cy="9" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M15 20c.2-2.6 1.8-4.4 4-4.9" stroke="currentColor" stroke-width="1.6"/></svg><span class="lbl">Students</span></button>
            <button data-tab="schedule"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="lbl">Schedule</span></button>
            <button data-tab="journal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 19V6a2 2 0 0 1 2-2h11l3 3v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" stroke="currentColor" stroke-width="1.6"/><path d="M8 8h6M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="lbl">Journal</span></button>
            <button data-tab="income"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 6-8 3 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 21h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="lbl">Income</span></button>
        </nav>
        <div class="sidebar-footer">Data syncs in real-time. ZAR · Secure Cloud Engine Active.</div>
    </aside>

    <div class="main">
        <div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>
        <div class="content" id="content"></div>
    </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div id="toastHost"></div>

<script src="ui-components.js"></script>
<script src="app.js"></script>

<script>
    const themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      themeBtn.innerText = isLight ? '🌙' : '☀️';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
    if(localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
      themeBtn.innerText = '🌙';
    }
</script>
</body>
</html>
